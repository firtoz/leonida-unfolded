<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Leonida Unfolded demo</title>
  <link rel="icon" type="image/webp" sizes="128x128" href="./explorer.webp">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./demo.css">
  <script type="module" src="./demo.js"></script>
</head>
<body>
  <main class="demo">
    <h1>Leonida Unfolded demo</h1>
    <p>Explore a sample island generated by the viewer. No game files needed.</p>
    <div class="actions">
      <button id="walk" type="button">Walk here</button>
      <button id="back" type="button" hidden>Back to map</button>
      <label id="water"><input type="checkbox" checked> Water effects</label>
      <a href="./">Open the viewer</a>
      <a href="./SOURCE.txt">Source</a> · <a href="./LICENSE">GPLv3 license</a>
    </div>
    <p id="demo-controls" hidden>Use WASD to move and drag to look around.</p>
    <p id="demo-status" role="status"></p>
    <canvas id="demo-map" aria-label="Raised map of the sample island"></canvas>
    <canvas id="demo-walk" aria-label="Sample island first-person view" tabindex="0" hidden></canvas>
    <div id="demo-hud" hidden>
      <span id="demo-bearing"></span><canvas id="demo-minimap"></canvas><span id="demo-marker"></span>
      <aside id="demo-fps"><span id="demo-idle"></span></aside>
    </div>
  </main>
</body>
</html>
